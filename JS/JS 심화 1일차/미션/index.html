<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intersection Observer Example</title>
  <style>
    .post {
      margin: 20px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: opacity 0.5s ease-in-out;
    }
    .hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="post-container"></div>
  <script>
    // 데이터를 저장할 배열
    let posts = [];
    // 현재 페이지를 추적하는 변수
    let currentPage = 1;
    // 한 페이지에 보여줄 데이터 수
    const postsPerPage = 10;

    // JSONPlaceholder에서 데이터를 가져오는 함수
    async function fetchPosts() {
      const response = await fetch('https://jsonplaceholder.typicode.com/posts');
      posts = await response.json();
      displayPosts();
    }

    // 데이터를 화면에 보여주는 함수
    function displayPosts() {
      //포스트를 붙일 부모 엘리먼트 호출
      const container = document.getElementById('post-container');
      //현재 페이지의 시작 인덱스 계산
      const start = (currentPage - 1) * postsPerPage;
      //현재 페이지의 끝 인덱스 계산
      const end = currentPage * postsPerPage;
            
      //currentPosts 변수에 한 페이지에 보여줄 만큼 데이터를 잘라서 복사
      const currentPosts = posts.slice(start, end);

      //currentPosts 배열로 HTML 생성 및 container 끝에 붙이기
      currentPosts.forEach(post => {
        //새 div 요소 생성
        const postDiv = document.createElement('div');
        //post 클래스와 hidden 클래스 동사 추가
        postDiv.classList.add('post', 'hidden');
        //포스트 내용 채우기
        postDiv.innerHTML = `<h2>${post.id}. ${post.title}</h2><p>${post.body}</p>`;
        //container 끝에 postDiv 추가
        container.appendChild(postDiv);

        //애니메이션 처리 : 100ms 후에 hidden 클래스 제거
        setTimeout(() => {
          postDiv.classList.remove('hidden');
        }, 100);
      });

      // 현재 페이지를 증가시킴
      currentPage++;
      // Intersection Observer를 설정
      setObserver();
    }

    // Intersection Observer를 설정하는 함수
    function setObserver() {
      const options = {
        root: null,
        rootMargin: '0px',
        threshold: 1.0
      };

      // ✅ 여기에 intersection observer 를 활용해서 요구사항에 맞게 개발해주세요

      // 관찰자 생성
      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          
          // 요소가 화면에 보이는지 확인
          if (entry.isIntersecting) {
            // 마지막 포스트가 화면에 보이면 다음 페이지의 포스트를 불러옴
            displayPosts();
            // 관찰 중지
            observer.unobserve(entry.target);
            // 더 많은 포스트가 있는지 확인
            if ((currentPage - 1) * postsPerPage >= posts.length) {
              return; // 더 이상 불러올 포스트가 없으면 종료
            
          }
        }
      });
      }, options);
      

      // ✅ 마지막 포스트 요소를 관찰하여, 마지막 요소에만 observer를 적용해야 합니다
      const postElements = document.querySelectorAll('.post');
      // 마지막 포스트 요소 선택
      const lastPost = postElements[postElements.length - 1];
      if (lastPost) {
        observer.observe(lastPost);
      }
    }

    // 페이지 로드 시 데이터를 가져옴
    fetchPosts();
  </script>
</body>
</html></html>
