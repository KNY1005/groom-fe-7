<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ✅ 여기 reset.css 적용해주세요 -->
    <title>Document</title>
    <style>
      body {
        padding: 40px;
      }
      h1 {
        font-size: 30px;
        font-weight: 700;
        color: #333;
        padding-bottom: 20px;
        border-bottom: 2px solid rgba(0, 0, 0, 0.5);
      }
      ul {
        padding: 20px 0;
      }
      li {
	      list-style-type: none;
        margin-bottom: 10px;
      }
      button {
        padding: 10px 20px;
        margin-top: 10px;
        font-size: 16px;
        font-weight: 500;
        color: #fff;
        background-color: #373737;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      li > h3 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #333;
      }
      li > p {
        font-size: 16px;
        color: #666;
        line-height: 120%;
      }
    </style>
  </head>
  <body>
    <h1>API 로 가져온 리스트 뿌려주기</h1>

    <button id="cut-btn">1 ~ 50 까지 자르기</button>
    <button id="cut-reverse">다시 100개로 되돌리기</button>

		<!-- ✅ 여기 안에 li 태그들이 들어가며 리스트가 뿌려지게 됩니다. -->
		<!-- ✅ li 태그 내부 들어갈 코드 : <h3>${item.id}. ${item.title}</h3> <p>${item.body}</p> -->
    
    <ul></ul>

    <script>
      // API 는 https://jsonplaceholder.typicode.com/posts 를 사용하세요 
      // ✅ 여기에 자유롭게 자바스크립트를 사용하여 개발해주세요.
      
      // fetch 함수를 사용하여 API 데이터 가져오기
      fetch("https://jsonplaceholder.typicode.com/posts")
      // 응답을 THEN으로 JSON 형태로 변환
      .then((response) => response.json())
      // JSON 데이터를 처리
      .then((data) => {
        json = data;

        // ul 태그 내부에 li 태그들을 추가
        data.forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `<h3>${item.id}. ${item.title}</h3> <p>${item.body}</p>`;
          document.querySelector('ul').appendChild(li);
        });
      });

      // 전역 변수로 json 데이터 저장
      let json = [];

      // 1 ~ 50 까지 싹둑
      document.getElementById('cut-btn').addEventListener('click', function() {
        // ul 태그 선택
        const ul = document.querySelector('ul');
         // 기존 리스트 초기화
        ul.innerHTML = '';
        // 1 ~ 50 까지 자른 데이터로 리스트 다시 생성
        json.slice(0, 50).forEach(item => {
          // li 태그 생성 및 추가
          const li = document.createElement('li');
          // data 내용 삽입
          li.innerHTML = `<h3>${item.id}. ${item.title}</h3> <p>${item.body}</p>`;
          // ul 태그에 li 추가
          ul.appendChild(li);
        });
        
        // 다시 100개로 쇼로록 
        document.getElementById('cut-reverse').addEventListener('click', function() {
          const ul = document.querySelector('ul');
          // 기존 리스트 초기화
          ul.innerHTML = '';
          // 전체 데이터로 리스트 다시 생성
          json.forEach(item => {
            // li 태그 생성 및 추가
            const li = document.createElement('li');
            // data 내용 삽입
            li.innerHTML = `<h3>${item.id}. ${item.title}</h3> <p>${item.body}</p>`;
            // ul 태그에 li 추가
            ul.appendChild(li);
          });
        });
      });
    </script>
  </body>
</html>
