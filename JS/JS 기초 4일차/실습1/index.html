<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <style>
      /* blue 클래스명을 가진 요소의 글씨 색상을 blue로 적용합니다. */
    </style>
  </head>

  <body>
    <div></div>

    <script>
      // 미션1
	    // 빈 div 태그에 아래 텍스트를 넣어주세요 (html 직접 건드리지 않습니다!!!)
	    // Hello, World! - h1 태그 사용
	    // 안녕하세요! - p 태그 사용
			// h1 태그에 blue 라는 class명을 추가하여 글씨 색상을 파란색으로 적용합니다.

      // 내 답안
      document.querySelector('div').innerHTML = '<h1>Hello, World!</h1><p>안녕하세요!</p>';
      document.querySelector('h1').classList.add('blue');
      document.querySelector('style').textContent = `.blue {color: blue;}`;
      
      // 모범답안
      const divEl = document.querySelector('div');
      divEl.innerHTML = '<h1 class="blue">Hello, World!</h1><p>안녕하세요!</p>';
      const h1El = document.querySelector("h1");
      h1El.style.color = "blue";
    </script>
  </body>
</html>
