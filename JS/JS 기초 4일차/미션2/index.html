<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <link rel="stylesheet" href="../reset.css" />

    <title>Document</title>
    
    <style>
	    body {
			  padding: 30px;
			}
			h2 {
			  color: darkblue;
			  font-size: 20px;
			  font-weight: bold;
			  margin-bottom: 10px;
			  text-align: center;
			}
			ul {
			  display: flex;
			  background-color: lightskyblue;
			  padding: 20px;
			  justify-content: space-around;
			}
			ul > li {
			  list-style: none;
			  font-size: 18px;
			  padding: 10px;
			  border-radius: 5px;
			}
			
			#reverse-btn {
			  float: right;
			  margin-top: 10px;
			  padding: 10px 20px;
			  background-color: white;
			  border-radius: 10px;
			  font-size: 18px;
			  border-color: gray;
			}
    </style>
  </head>
  <body>
    <h2>JS Second Practice Day2</h2>

    <ul id="arr-list-container"></ul>

    <button id="reverse-btn">Click to reverse!</button>
    
    <script>
	    // 여기에 코드를 작성해주세요.
      //ul 태그에 아래 배열에 있는 요소들을 각각 li 태그로 그려주세요.
      const arr_list = ["one", "two", "three", "four", "five", "six"];

      //ul 태그 선택 후 변수에 할당
      const ulEl = document.getElementById('arr-list-container');

      //배열의 요소들을 li 태그로 만들어 ul 태그 내부에 추가하는 함수
      function renderList() {

        //ul 태그 내부를 비워준 다음
        ulEl.innerHTML = '';
        
        //그 후 배열의 요소들을 li 태그로 만들어 ul 태그 내부에 추가
        for (let i = 0; i < arr_list.length; i++) {

          //li 태그 생성 후 텍스트 추가 및 ul 태그 내부에 추가
          const liEl = document.createElement('li');

          //li 태그의 텍스트는 배열의 i번째 요소로 설정
          liEl.textContent = arr_list[i];

          //ul 태그 내부에 li 태그 추가
          ulEl.appendChild(liEl);
        }
      }
      //초기 렌더링
      renderList();

      //Click to reverse 버튼을 누를 때마다 배열의 요소가 역순으로 바뀌어 그려집니다.
      const reverseBtn = document.getElementById('reverse-btn');

      //버튼 클릭 시 배열 요소 역순으로 바꾸고 다시 렌더링
      reverseBtn.addEventListener('click', function() {
        //배열 요소 역순으로 변경
        arr_list.reverse();
        //다시 렌더링
        renderList();
      });

      //배열 요소가 담긴 li태그 클릭 시 배경색이 하얀색으로 바뀌고, 이미 하얀색이라면 다시 배경색을 없애줍니다. 
      ulEl.addEventListener('click', function(event) {
        //클릭된 요소가 li 태그인지 확인
        if (event.target.tagName === 'LI') {
          //배경색 토글
          if (event.target.style.backgroundColor === 'white') {
            //배경색이 하얀색이면 배경색 제거
            event.target.style.backgroundColor = '';
          } else {
            //배경색이 하얀색이 아니면 하얀색으로 변경
            event.target.style.backgroundColor = 'white';
          }
        }
      });

    </script>
  </body>
</html>
