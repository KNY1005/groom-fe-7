<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  <style>
    ul {
      padding: 20px;
    }

    li {
      padding: 20px;
      list-style: none;
      border: 1px solid #333;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    h3 {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    li > p.name {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
  </head>
  <body>
    <ul></ul>
  </body>
  <script>
      //async 함수 선언
      async function fetchComments() {
        try {
          //fetch로 데이터 가져오기
          const response = await fetch('https://jsonplaceholder.typicode.com/comments');
          
          //json()으로 파싱
          const data = await response.json();

          //50개로 제한
          const limitedData = data.slice(0, 50);

          //ul 선택
          const ul = document.querySelector('ul');

          //반복문으로 li 생성
          limitedData.forEach(element => {
            const li = document.createElement('li');

            //innerHTML 작성
            li.innerHTML = `
              <h3>${element.email}</h3>
              <p class='name'>${element.name}</p>
              <p>${element.body}</p>
            `;

            //ul에 li 추가
            ul.appendChild(li);
          });

        } catch (error) {
          console.error("데이터를 가져오는 중 오류 발생:", error);
        }
      }

      // 함수 실행
      fetchComments();
    </script>
</html>
