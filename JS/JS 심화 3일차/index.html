//아래 board 객체에 게시글을 추가, 삭제, 조회하는 메서드를 구현하여 게시판 시스템을 만들어주세요.
const board = {
  
  posts: [],

  // 여기에 addPost, removePost, showPosts 메서드를 추가하세요.
    addPost(post) {
      this.posts.push(post);
    },

    removePost(index) {
      const idx = index - 1;
      if (idx < 0 || idx >= this.posts.length) {
        console.log("해당 게시글이 없습니다.");
        return;
      }
      const [removed] = this.posts.splice(idx, 1);
      console.log(`게시글 삭제: ${removed}`);
    },

    showPosts() {
      console.log("현재 게시글 목록:");
      if (this.posts.length === 0) {
        console.log("게시글이 없습니다.");
        return;
      }
      this.posts.forEach((p, i) => {
        console.log(`${i + 1}. ${p}`);
      });
    }
};

// 실행 예시
board.addPost("오늘의 점심은 김치찌개!");
board.addPost("자바스크립트 공부 중 🖥️");
